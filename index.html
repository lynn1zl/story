<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 보안: 이 사이트 안의 스크립트만 실행하고, 통신은 글꼴 서버로만 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<title>서사 니니닝!</title>
<meta name="description" content="서사 니니닝! — 세계관, 캐릭터, 주요 개념, 관계성, 타임라인을 한 장의 서사표 이미지로 저장하는 사이트">
<meta property="og:title" content="서사 니니닝!">
<meta property="og:description" content="캐릭터 배경과 페어 관계성을 한 장으로 정리하는 서사표">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c20" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233182f6'/%3E%3Cg fill='%23fff' transform='translate(6 5) scale(2.17)'%3E%3Cellipse cx='8.4' cy='7.2' rx='2.4' ry='5.6' transform='rotate(-12 8.4 7.2)'/%3E%3Cellipse cx='15.6' cy='7.2' rx='2.4' ry='5.6' transform='rotate(12 15.6 7.2)'/%3E%3Cellipse cx='12' cy='15.4' rx='7' ry='6.3'/%3E%3Ccircle cx='9.4' cy='14.8' r='1' fill='%233182f6'/%3E%3Ccircle cx='14.6' cy='14.8' r='1' fill='%233182f6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233182f6'/%3E%3Cg fill='%23fff' transform='translate(6 5) scale(2.17)'%3E%3Cellipse cx='8.4' cy='7.2' rx='2.4' ry='5.6' transform='rotate(-12 8.4 7.2)'/%3E%3Cellipse cx='15.6' cy='7.2' rx='2.4' ry='5.6' transform='rotate(12 15.6 7.2)'/%3E%3Cellipse cx='12' cy='15.4' rx='7' ry='6.3'/%3E%3Ccircle cx='9.4' cy='14.8' r='1' fill='%233182f6'/%3E%3Ccircle cx='14.6' cy='14.8' r='1' fill='%233182f6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins/assets.css">
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">서사 니니닝!</span>
    </div>
    <div class="appbar-right">
      <div class="hist">
        <button type="button" class="icon-btn" id="btn-undo" aria-label="되돌리기" title="되돌리기 (Ctrl/⌘ + Z)" disabled><span data-icon="undo"></span></button>
        <button type="button" class="icon-btn" id="btn-redo" aria-label="다시 하기" title="다시 하기 (Ctrl/⌘ + Shift + Z)" disabled><span data-icon="redo"></span></button>
      </div>
      <div class="menu-wrap">
        <button type="button" class="icon-btn" id="btn-more" aria-label="더 보기" aria-haspopup="true"></button>
        <div class="menu" id="menu" hidden>
          <button type="button" id="ai-open">서사표 간단 채우기</button>
          <button type="button" data-act="sample">예시 불러오기</button>
          <div class="menu-sep"></div>
          <button type="button" data-act="export-json">작업 파일로 내보내기</button>
          <label>작업 파일 불러오기<input type="file" id="file-import" accept="application/json,.json" hidden></label>
          <div class="menu-sep"></div>
          <button type="button" data-act="reset" class="danger">초기화…</button>
          <div class="menu-sep"></div>
          <a class="menu-contact" href="https://x.com/lynn1zl" target="_blank" rel="noopener">사용 문의 · 오류 제보 <b>@lynn1zl</b></a>
        </div>
      </div>
      <button type="button" class="btn btn-soft" id="btn-copy" title="이미지를 클립보드에 복사">
        <span class="btn-icon" data-icon="copy"></span><span class="btn-label">복사</span>
      </button>
      <button type="button" class="btn btn-primary" id="btn-save" title="이미지 저장 (Ctrl/⌘ + S)">
        <span class="btn-icon" data-icon="download"></span><span class="btn-label">이미지 저장</span>
      </button>
    </div>
  </header>

  <div class="workspace">
    <nav class="rail" id="rail" aria-label="설정 메뉴"></nav>
    <aside class="panel" id="panel">
      <button type="button" class="sheet-handle" id="sheet-handle" aria-label="설정 닫기"><span></span></button>
      <div class="panel-scroll" id="panel-scroll"></div>
    </aside>
    <main class="canvas-area" id="canvas-area">
      <div id="stage">
        <div class="stage-inner" id="stage-inner">
          <div class="scaler" id="scaler"><div id="card"></div></div>
        </div>
      </div>
      <div class="hud" id="hud">
        <button type="button" class="icon-btn sm" data-zoom="out" aria-label="축소"></button>
        <button type="button" class="hud-val" data-zoom="fit" id="zoom-val" title="화면에 맞추기">100%</button>
        <button type="button" class="icon-btn sm" data-zoom="in" aria-label="확대"></button>
      </div>
    </main>
  </div>
</div>

<input type="file" id="file-img" accept="image/*" hidden>

<div class="modal" id="modal" hidden>
  <div class="modal-box narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><div><h3 id="modal-title"></h3><p class="modal-sub" id="modal-sub"></p><input class="input modal-input" id="modal-input" type="url" inputmode="url" autocomplete="off" hidden></div></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">취소</button>
      <button type="button" class="btn btn-primary" id="modal-ok">확인</button>
    </div>
  </div>
</div>

<div class="modal" id="crop" hidden>
  <div class="modal-box crop-box" role="dialog" aria-modal="true" aria-labelledby="crop-title">
    <div class="modal-head crop-head"><h3 id="crop-title">이미지 자르기</h3>
      <div class="crop-swap">
        <button type="button" class="chip" id="crop-file"><span data-icon="image"></span>바꾸기</button>
        <button type="button" class="chip" id="crop-link"><span data-icon="link"></span>링크</button>
      </div>
    </div>
    <div class="crop-stage"><div class="crop-frame" id="crop-frame"></div></div>
    <div class="row stack crop-ctl"><div class="row-top"><span class="row-label">확대</span><span class="val" data-unit="×"></span></div><input type="range" class="slider" id="crop-zoom" min="1" max="4" step="0.01"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="crop-reset">처음대로</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="crop-cancel">취소</button>
      <button type="button" class="btn btn-primary" id="crop-ok">적용</button>
    </div>
  </div>
</div>

<div class="modal" id="ai" hidden>
  <div class="modal-box ai-box" role="dialog" aria-modal="true" aria-labelledby="ai-title">
    <div class="modal-head"><div><h3 id="ai-title">서사표 간단 채우기</h3></div></div>
    <div class="ai-body">
      <div class="ai-step"><b>1</b>캐릭터 · 세계관 글을 붙여넣어요</div>
      <p class="ai-tip">상세 페이지의 소개 글과 캐릭터 이미지 주소를 함께 붙여넣어 주세요. 이미지 주소는 이미지에서 오른쪽 클릭 → ‘이미지 주소 복사’로 가져올 수 있어요.</p>
      <textarea class="input" id="ai-src" rows="6" placeholder="상세 페이지 글 + 캐릭터 이미지 주소"></textarea>
      <textarea class="input" id="ai-memo" rows="2" placeholder="캐릭터를 어떤 위치에 배치할지 입력하세요&#10;예: 000은 A에 or 000은 B에, 나머지는 NPC" aria-label="캐릭터 배치"></textarea>
      <p class="ai-tip" id="ai-info-tip"></p>
      <div class="ai-step"><b>2</b>프롬프트를 복사해서 AI에게 정리를 맡겨요</div>
      <div class="ai-row">
        <button type="button" class="btn btn-primary" id="ai-copy"><span data-icon="copy"></span>프롬프트 복사</button>
        <a class="chip" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a>
        <a class="chip" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Claude</a>
        <a class="chip" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini</a>
      </div>
      <div class="ai-step"><b>3</b>AI가 준 답변을 그대로 붙여넣어요</div>
      <textarea class="input" id="ai-res" rows="4" placeholder="{ &quot;world&quot;: … }"></textarea>
      <div id="ai-preview"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="ai-cancel">닫기</button>
      <button type="button" class="btn btn-primary" id="ai-apply" disabled>서사표에 넣기</button>
    </div>
  </div>
</div>

<div class="fmtbar" id="fmtbar" hidden>
  <button type="button" data-fmt="**" title="굵게 (Ctrl/⌘ + B)"><b>B</b></button>
  <button type="button" data-fmt="*" title="기울임 (Ctrl/⌘ + I)"><i>I</i></button>
  <button type="button" data-fmt="==" title="형광펜 (Ctrl/⌘ + Shift + H)"><mark>H</mark></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
